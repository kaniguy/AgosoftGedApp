name: agosoftged

services:
  backend:
    build:
      context: ./backend_ged
      dockerfile: Dockerfile
    image: kaniguy/agosoftged-backend:latest
    platform: linux/amd64
    container_name: agosoftged-backend
    restart: unless-stopped
    env_file:
      - ./backend_ged/config/.env
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: "1433"
      DB_DRIVER: "ODBC Driver 18 for SQL Server"
      DB_TRUSTED_CONNECTION: "no"
      DB_TRUST_SERVER_CERTIFICATE: "yes"
      ALLOWED_HOSTS: "127.0.0.1,localhost,192.168.1.24,backend,agosoftged-backend,*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9000:9000"
    volumes:
      - ./backend_ged/media:/app/media
      - ./backend_ged/logs:/app/logs
    networks:
      - ged-net

  frontend:
    build:
      context: ./frontend_ged
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BACKEND_URL: http://127.0.0.1:9000
        NEXT_PUBLIC_API_PORT: "9000"
    image: kaniguy/agosoftged-frontend:latest
    platform: linux/amd64
    container_name: agosoftged-frontend
    restart: unless-stopped
    environment:
      API_BACKEND_INTERNAL_URL: http://backend:9000
      NEXT_PUBLIC_API_BACKEND_URL: http://127.0.0.1:9000
      NEXT_PUBLIC_API_PORT: "9000"
    ports:
      - "3001:3000"
    volumes:
      - ./frontend_ged/logs:/app/logs
    depends_on:
      - backend
    networks:
      - ged-net

networks:
  ged-net:
    driver: bridge
