# Override automatique pour PC Windows ARM64 (via installer.bat).
# SQL Server 2022 n'existe pas en ARM → Azure SQL Edge (AMD64 + ARM64).

services:
  db:
    image: mcr.microsoft.com/azure-sql-edge:1.0.7
    platform: linux/arm64
    environment:
      ACCEPT_EULA: "Y"
    cap_add:
      - SYS_PTRACE
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  backend:
    platform: linux/arm64
